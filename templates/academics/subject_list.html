{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>{{ title }}</h2>
    <a href="{% url 'academics:subject_create' %}" class="btn btn-primary mb-3">Create Subject</a>
    <ul class="list-group">
        {% for subject in subjects %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ subject.name }} ({{ subject.code }})
                <div>
                    <a href="{% url 'academics:subject_update' subject.pk %}" class="btn btn-sm btn-info">Edit</a>
                    <a href="{% url 'academics:subject_delete' subject.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item">No subjects found.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
