{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>{{ title }}</h2>
    <a href="{% url 'finance:expense_category_create' %}" class="btn btn-primary mb-3">Add Category</a>
    <ul class="list-group">
        {% for category in categories %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ category.name }}
                <div>
                    <a href="{% url 'finance:expense_category_update' category.pk %}" class="btn btn-sm btn-info">Edit</a>
                    <a href="{% url 'finance:expense_category_delete' category.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item">No expense categories found.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
