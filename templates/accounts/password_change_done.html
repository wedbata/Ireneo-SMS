{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} | Ireneo SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">{% trans "Password Changed" %}</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <p>{% trans "Your password has been changed successfully." %}</p>
                </div>
                <a href="{% url 'profile' %}" class="btn btn-primary">{% trans "Return to Profile" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
